name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public Cerbos Hub embedded PDP rule used by the integration tests. Override with a repository
  # variable to point the tests at a rule owned by this repository's maintainers.
  CERBOS_RULE_ID: ${{ vars.CERBOS_RULE_ID || 'AVGB9RP6HFBL' }}

jobs:
  bridge:
    name: Bridge (TypeScript, esbuild, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CerbosBridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CerbosBridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed assets match the build
        run: |
          git diff --exit-code -- \
            ../cerbos-embedded-pdp/src/main/assets/cerbos-epdp/bridge.js \
            ../cerbos-embedded-pdp/src/main/assets/cerbos-epdp/server.wasm \
            ../cerbos-embedded-pdp/src/main/assets/cerbos-epdp/index.html \
            ../cerbos-embedded-pdp/src/main/assets/cerbos-epdp/manifest.json
      - name: Smoke test against the real engine and Cerbos Hub
        run: npm test

  android:
    name: Android (format, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew ktfmtCheck
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  instrumented:
    name: Integration test on the Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run the integration test against Cerbos Hub
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :cerbos-embedded-pdp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.CERBOS_RULE_ID=${{ env.CERBOS_RULE_ID }}
      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
