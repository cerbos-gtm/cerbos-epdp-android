version: 2
updates:
  - package-ecosystem: npm
    directory: /CerbosBridge
    schedule:
      interval: weekly
    # The Refresh embedded assets workflow updates these, because it must also rebuild the assets.
    ignore:
      - dependency-name: "@cerbos/*"
      - dependency-name: "@bufbuild/*"
    groups:
      tooling:
        patterns: ["esbuild", "typescript"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["com.android.*", "androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
