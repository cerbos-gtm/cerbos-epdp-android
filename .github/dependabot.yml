version: 2
updates:
  - package-ecosystem: npm
    directory: /CerbosBridge
    schedule:
      interval: weekly
    groups:
      cerbos:
        patterns: ["@cerbos/*", "@bufbuild/*"]
      tooling:
        patterns: ["esbuild", "typescript"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["com.android.*", "androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
